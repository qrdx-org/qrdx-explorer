name = "qrdx-explorer"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
# Keep function names out of the bundle. With them, esbuild wraps functions in __name(), and a
# function sent to the browser as an inline script (next-themes' theme script) then throws
# "__name is not defined" there, before the page has its theme.
keep_names = false

[assets]
directory = ".open-next/assets"
binding = "ASSETS"
